{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berth</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{v}}">
<script src="/static/theme.js?v={{v}}"></script>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
</head><body>
<header><a class="brand" href="/"><img src="/static/logo.svg?v={{v}}" alt="">Berth</a>
{{with .}}{{if .User}}<nav aria-label="Main"><a href="/">{{icon "layout-grid"}}<span>Apps</span></a><a href="/discover">{{icon "search"}}<span>Discover</span></a></nav>{{end}}{{end}}
<span class="sp"></span>
<button type="button" class="plain" id="theme-toggle" aria-label="Switch between light and dark mode"><span class="i-moon">{{icon "moon"}}</span><span class="i-sun">{{icon "sun"}}</span></button>
{{with .}}{{if .User}}<span class="user">{{icon "circle-dot"}}<span>{{.User}}</span></span><form method="post" action="/logout"><button class="plain">{{icon "log-out"}}Log out</button></form>{{end}}{{end}}
</header><main>{{block "crumbs" .}}{{end}}{{template "content" .}}</main>
<script src="/static/htmx.min.js?v={{v}}"></script><script src="/static/app.js?v={{v}}"></script></body></html>{{end}}
